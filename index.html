<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Document</title>
</head>

<body>

    <header></header>

    <main>
       

        <div class="card">

            <div class="card-body">

                <div class="card-title">
                    <h3>Search for a rental car</h3>
                </div>

                <div class="card-body">

                    <form>

                        <div class="row">
                            <div class="col-md-12">

                                <label class="form-label">
                                    Pick up location
                                </label>

                                <input
                                    class="form-control"
                                    type="text"
                                    placeholder="City, airport, region, district....">

                            </div>
                        </div>


                       
                        <div class="row">
                            <div class="col-md-12">

                                <input
                                    type="checkbox"
                                    class="form-check-input">

                                <label class="form-check-label">
                                    Deliver the car somewhere else
                                </label>

                            </div>
                        </div>


                        <!-- Dates -->
                        <div class="row">

                            <div class="col-md-6">

                                <label class="form-label">
                                    Date Of pick up
                                </label>

                                <input
                                    class="form-control"
                                    type="date">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label">
                                    Date Of Delivery
                                </label>

                                <input
                                    class="form-control"
                                    type="date">

                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-6">
                                <input
                                    class="form-control"
                                    type="time">
                            </div>

                            <div class="col-md-6">
                                <input
                                    class="form-control"
                                    type="time">
                            </div>

                        </div>


                        
                        <div class="row">

                            <div class="col-md-12">

                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    checked>

                                <label class="form-check-label">
                                    The driver's age between 30 and 65?
                                    <i class="bi bi-info-circle"></i>
                                </label>

                            </div>

                        </div>
                           <div class="row">
                            <h5>
                        <i class="bi bi-check2"></i>
                        No credit card fees
                    </h5>

                    <h5>
                        <i class="bi bi-check2"></i>
                        No change fees
                    </h5>

                    <h5>
                        <i class="bi bi-check2"></i>
                        Price match guarantee
                    </h5>
                    </div>


                  
                        <div class="row">

                            <div class="col-md-12 text-center">

                                <button
                                    type="submit"
                                    class="btn btn-outline-success">
                                    Search
                                </button>

                            </div>

                        </div>

                    </form>


                 
                  
                

                </div>

            </div>

        </div>

    </main>

    <footer></footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>
</html>
